[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lup-ai"
version = "0.1.0"
description = "LUP AI: Personal Decision Intelligence Agent backed by Snowflake, deterministic Python anonymization/analytics, and Gemini 3.8."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "SQLAlchemy>=2.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.2.0",
]
snowflake = [
    "snowflake-connector-python>=3.12.0",
    "sqlglot>=25.0.0",
]
llm = [
    "google-genai>=1.0.0",
]
privacy = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
]
ui = [
    "streamlit>=1.39.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
lup = "lup_ai.cli.app:app"
lup-seed = "lup_ai.seeds.generate_synthetic_data:main"
lup-scan = "lup_ai.jobs.proactive_scan:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
